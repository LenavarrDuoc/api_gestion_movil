services:
  mysql-db:
    image: mysql:8.0 # O la versión que tengas (ej. mysql:latest)
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Admin123!
      MYSQL_DATABASE: gestion_movil_db
      MYSQL_USER: user_spring
      MYSQL_PASSWORD: User123!
    ports:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql-db
      PMA_PORT: 3306
    ports:
      - "80"
    depends_on:
      - mysql-db

volumes:
  mysql_data: