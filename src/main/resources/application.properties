spring.application.name=api_gestion_movil
server.port=8080


# Cnfiguración MySQL:
# Automática con
# Para que Spring Boot no intente apagar tu base de datos cuando detengas la API
spring.docker.compose.lifecycle-management=start-only

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Estrategia de nombres para respetar mayúsculas/minúsculas en Linux/MySQL
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl